schema: spec-driven

# Always-loaded invariants only. Read relevant README and runbook sections on demand.
context: |
  Moomoo MCP server (Python >=3.10, uv, FastMCP) with process-owned OpenD
  connections. This fork ships containers; upstream owns PyPI publishing.
  Requirements: openspec/specs/. Usage and checks: README.md (Contributing).
  Production operations and recovery: docs/deploy-vps.md.
  Implementation details and exact versions: source, tests and build configuration.
  Read only the specs and documentation relevant to the change.

  Invariants:
  - Preserve Python 3.10 syntax/type compatibility (pyproject.toml).
  - Gateway connections belong to the process, never a request/session lifespan.
  - Streamable HTTP is stateless; authentication is enforced independently.
  - Keep diagnostics callable when OpenD is unavailable; offload blocking SDK work.
  - Enforce READ_ONLY/SIMULATE/REAL before gateway writes or unlocks; no startup unlock.
  - Never replay a trading command after an unknown outcome; reconcile by querying.
  - Preserve the durable SIMULATE journal across SIMULATE/REAL mode changes;
    READ_ONLY never opens it. Recovery review gates new admissions.
  - Never read or commit secrets; use .env.example and operator-run auth steps.
  - Do not use regex in code; use explicit string methods or conditionals.

  Follow the Completion policy in AGENTS.md.
