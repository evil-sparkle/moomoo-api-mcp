config_version: 1
control_plane:
  base_url: https://api.openai.com
  api_key: env:CONTROL_PLANE_API_KEY
health:
  listen_addr: 127.0.0.1:8080
  url_file: /run/moomoo-chatgpt-tunnel/health-url
process:
  pid_file: /run/moomoo-chatgpt-tunnel/client.pid
log:
  level: warn
  format: json
  http_raw_unsafe: false
admin_ui:
  open_browser: false
  allow_remote: false
mcp:
  server_urls:
    - channel: main
      url: http://moomoo-mcp:8000/mcp
  extra_headers:
    Authorization: env:MCP_AUTHORIZATION
  discovery_extra_headers:
    Authorization: env:MCP_AUTHORIZATION
  startup_wait_timeout: 30s
  connection_max_ttl: 30s
