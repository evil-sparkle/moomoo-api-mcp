# Smoke-test overlay: replaces the OpenD *binary* with a stand-in, and nothing
# else.
#
# The real gateway needs an interactive device login and Moomoo's servers, so it
# cannot run in CI. Everything around it can: this overlay keeps the deployed
# image, the supervisor, the ports, the volume and the restart policy exactly as
# docker-compose.yml declares them, and only points OPEND_BINARY at a stub. So
# the supervision policy under test is the deployed one, running in the deployed
# image -- tests/test_compose_topology.py asserts this overlay moves nothing
# else, or the smoke test could quietly start passing against a stack nobody
# deploys.
#
# The stub honours the -api_ip flag it is handed rather than assuming loopback,
# which is what lets the smoke test prove the gateway is not reachable from
# another container.
services:
  moomoo-mcp:
    # Set in the base file, and global rather than per-project: it would collide
    # with a real stack on the same host. The project name isolates the smoke
    # run instead.
    container_name: !reset null
    environment:
      - OPEND_BINARY=/opt/opend-stub
      # A stubbed gateway that dies is a test scenario, not a broken deployment:
      # keep restarts quick so the assertions do not wait out a backoff.
      - OPEND_RESTART_WINDOW_SECONDS=60
    volumes:
      - ./tests/fixtures/opend_stub.py:/opt/opend-stub:ro
