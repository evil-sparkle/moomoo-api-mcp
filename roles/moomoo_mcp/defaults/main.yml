---
moomoo_mcp_image: ""
moomoo_mcp_tunnel_image: ""
moomoo_mcp_revision: ""
moomoo_mcp_source_dir: ""
moomoo_mcp_home: "/home/{{ ansible_user }}"
moomoo_mcp_root: "{{ moomoo_mcp_home }}/.local/share/moomoo-api-mcp"
moomoo_mcp_release: "{{ moomoo_mcp_root }}/releases/{{ moomoo_mcp_revision }}-{{ moomoo_mcp_image.split('@sha256:')[-1] }}-{{ moomoo_mcp_tunnel_image.split('@sha256:')[-1] }}-{{ moomoo_mcp_tunnel_enabled | ternary('tunnel', 'local') }}"
# Set the existing project explicitly; changing it can select different state.
moomoo_mcp_project: ""
moomoo_mcp_env_file: "{{ moomoo_mcp_home }}/moomoo/.env"
moomoo_mcp_legacy_root: "{{ moomoo_mcp_env_file | dirname }}"
moomoo_mcp_expected_mode: READ_ONLY
moomoo_mcp_tunnel_enabled: false
