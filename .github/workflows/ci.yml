name: CI & Docker Build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      - name: Run Ruff Lint
        run: |
          uv run ruff check .
      - name: Run Tests
        run: |
          uv run pytest

  docker-build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write   # required to mint the OIDC token for AWS
    env:
      # Only main-branch pushes publish. Feature branches and PRs build the
      # image and throw it away, which is also all the gha-ecr-push trust
      # policy permits them to do.
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: moomoo-api-mcp
            dockerfile: ./Dockerfile
          - image: moomoo-opend
            dockerfile: ./Dockerfile.opend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tags
        id: tags
        run: |
          if [ "${PUSH}" = "true" ]; then
            image="${{ steps.ecr.outputs.registry }}/${{ matrix.image }}"
            echo "tags=${image}:${GITHUB_SHA},${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ matrix.image }}:test" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Keeps the OpenD layer (a ~470MB download) out of most builds.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
