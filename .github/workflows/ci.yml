name: CI & Docker Build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# main runs queue (never cancel a publishing run), other refs cancel superseded runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decide what this push actually needs, before anything expensive starts.
  #
  # docs_only says the change touches nothing ruff, basedpyright, pytest or the
  # compose smoke test can catch, so test and smoke are skipped for it. The
  # image result is consumed by docker-build via
  # needs.changes.outputs.moomoo-api-mcp. PRs and feature-branch pushes force a
  # build (to catch Dockerfile regressions) unless the change is docs_only —
  # only main pushes honor the filter for code changes.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      moomoo-api-mcp: ${{ steps.filter.outputs.moomoo-api-mcp }}
      baseline: ${{ steps.filter.outputs.baseline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # so full commit history is available for baseline comparison

      - id: filter
        name: Compute the image change map
        run: |
          current="${GITHUB_SHA:-HEAD}"
          before="${{ github.event.before }}"
          event_name="${GITHUB_EVENT_NAME}"

          # Detect comparison baseline: support multi-commit pushes and PRs
          # Require ^{commit} to ensure git verifies the object exists in the repo
          is_valid_base=false
          if [ "${event_name}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if [ -n "${base}" ] && git rev-parse --quiet --verify "${base}^{commit}" >/dev/null 2>&1; then
              prev="$(git rev-parse --verify "${base}^{commit}")"
              is_valid_base=true
            fi
          elif [ -n "${before}" ] && [ "${before}" != "0000000000000000000000000000000000000000" ]; then
            if git rev-parse --quiet --verify "${before}^{commit}" >/dev/null 2>&1; then
              prev="$(git rev-parse --verify "${before}^{commit}")"
              is_valid_base=true
            fi
          fi

          # If push/PR baseline cannot be established, force a full build
          if [ "${is_valid_base}" = "false" ]; then
            echo "No valid baseline commit available; triggering a full build."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "moomoo-api-mcp=true" >> "$GITHUB_OUTPUT"
            echo "baseline=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Propagate git diff failures instead of silently continuing
          if ! changed_raw=$(git diff --name-only "${prev}" "${current}"); then
            echo "git diff failed between ${prev} and ${current}; triggering a full build."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "moomoo-api-mcp=true" >> "$GITHUB_OUTPUT"
            echo "baseline=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed <<< "${changed_raw}"
          echo "baseline=${prev}" >> "$GITHUB_OUTPUT"

          # A change is documentation-only when *every* changed path is prose:
          # openspec/, docs/, a Markdown file, or LICENSE. None of it is read by
          # ruff, basedpyright, pytest or the compose smoke test, so those jobs
          # have nothing to say about it. README.md and LICENSE count as prose
          # even though the Dockerfile COPYs them: they cannot fail a test, and
          # needed_mcp below still rebuilds the image that carries them.
          # .github/ is workflow, never prose — a change there runs everything.
          # An empty diff leaves this false, so the fallback is the full run.
          docs_only=false
          if [ -n "${changed_raw}" ]; then
            docs_only=true
            for path in "${changed[@]}"; do
              case "${path}" in
                .github/*) docs_only=false ;;
                docs/*|openspec/*|*.md|LICENSE) ;;
                *) docs_only=false ;;
              esac
              [ "${docs_only}" = "false" ] && break
            done
          fi
          echo "Documentation-only change: ${docs_only}"

          # Declare which paths the image rebuilds on. The "needed" set has to
          # include every Dockerfile input. One image now carries the gateway
          # too, and OpenD contributes no repo files of its own — only
          # network-fetched release assets pinned in the Dockerfile.
          needed_mcp=(
            "Dockerfile"
            "pyproject.toml"
            "uv.lock"
            "README.md"
            "LICENSE"
            "src/"
          )

          mcp=false
          for path in "${changed[@]}"; do
            # Workflow + overlay changes always force a build — never quietly
            # skip what the deploy path depends on.
            if [ "${path}" = ".github/workflows/ci.yml" ] \
              || [ "${path}" = ".dockerignore" ] \
              || [ "${path}" = "docker-compose.yml" ] \
              || [ "${path}" = "docker-compose.prod.yml" ] \
              || [ "${path}" = "docker-compose.paper.yml" ] \
              || [ "${path}" = "scripts/test-paper-container.sh" ] \
              || [ "${path}" = "tests/fixtures/paper_container_checks.py" ]; then
              mcp=true
              continue
            fi
            # Match path against needed_mcp entries without regex
            for needed in "${needed_mcp[@]}"; do
              ends_in_slash=false
              [ "${needed}" != "${needed%/}" ] && ends_in_slash=true
              if [ "${ends_in_slash}" = "true" ]; then
                prefix="${needed%/}/"
                [ "${path#"${prefix}"}" = "${path}" ] && continue
              else
                [ "${path}" != "${needed}" ] && continue
              fi
              mcp=true
              break
            done
          done

          # Honor the contract: PRs / feature branches always build, so no
          # Dockerfile regression reaches main unbuilt. Only main pushes follow
          # the filter — except for a docs-only change, which follows it
          # everywhere. That is what lets a README edit still rebuild the image
          # that COPYs it while an openspec edit builds nothing at all.
          if [ "${docs_only}" != "true" ] \
            && { [ "${GITHUB_EVENT_NAME}" = "pull_request" ] \
              || [ "${GITHUB_REF}" != "refs/heads/main" ]; }; then
            mcp=true
          fi

          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "moomoo-api-mcp=${mcp}" >> "$GITHUB_OUTPUT"

  # Specs are prose, so docs_only does not skip this job: an openspec/ edit is
  # exactly the change it exists to check. The CLI version is pinned so CI and
  # a local run (see the context in openspec/config.yaml) validate against the
  # same rules.
  # Structure only: --strict cannot tell whether a spec still matches the code.
  openspec:
    name: Validate OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate every spec and active change
        run: |
          npx -y @fission-ai/openspec@1.13.1 validate --all --strict --no-interactive

  test:
    name: Run Tests and Lint
    runs-on: ubuntu-latest
    needs: changes
    # Nothing in a documentation-only change can fail lint, type checks or the
    # suite, so do not spend a runner proving it. smoke needs this job and is
    # skipped along with it.
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
      # Keep these steps in sync with the local hooks in .pre-commit-config.yaml.
      - name: Run Ruff Lint
        run: |
          uv run ruff check .
      - name: Run Ruff Format Check
        run: |
          uv run ruff format --check .
      - name: Run basedpyright
        run: |
          uv run basedpyright
      # tests/test_compose_topology.py renders docker-compose.yml through
      # Compose itself, which is the only unit-level check covering the compose
      # file: docker-build below builds the image without ever starting it.
      # Fail here, with an obvious message, rather than inside the suite.
      - name: Check Docker Compose is available
        run: |
          docker compose version
      - name: Run Tests
        run: |
          uv run pytest

  # Unit tests read the compose file; this runs it. It stands the OpenD binary
  # in with a listener the runner can start, then asserts the gateway is
  # reachable over container loopback and from nowhere else, that killing the
  # gateway process leaves the container and a live client session untouched,
  # and that killing the server takes the container down for Docker to replace.
  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Run the container smoke test
        run: |
          ./scripts/smoke-test.sh
      - name: Verify persistent paper execution in isolated containers
        run: |
          # smoke-test builds this image and removes only its containers/volumes.
          # A second image identity exercises recreation across an image update.
          printf 'FROM moomoo-smoke-moomoo-mcp\nLABEL paper-container-check=recreated\n' | \
            docker build -t moomoo-paper-recreated -
          ./scripts/test-paper-container.sh moomoo-smoke-moomoo-mcp moomoo-paper-recreated

  # One image, because the gateway and the server now ship together. The
  # moomoo-opend ECR repository is no longer written to; leave it in place until
  # the last two-container deploy is past being a rollback target, then delete
  # it (see docs/deploy-vps.md).
  docker-build:
    name: Build moomoo-api-mcp
    runs-on: ubuntu-latest
    needs: [test, changes]
    # A skipped `test` would skip this job with it, so state the dependency as a
    # result check instead. Main pushes always come through: the retag step below
    # is what keeps the image tagged at the exact commit the deploy wrapper asks
    # for, and a documentation-only commit still has to be deployable. Anywhere
    # else there is nothing to do unless the image actually changed.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || needs.changes.outputs.moomoo-api-mcp == 'true'
      )
    permissions:
      contents: read
      id-token: write   # required to mint the OIDC token for AWS
    env:
      # Only main-branch pushes publish. Feature branches and PRs build the
      # image and throw it away, which is also all the gha-ecr-push trust
      # policy permits them to do.
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      IMAGE: moomoo-api-mcp
    steps:
      - uses: actions/checkout@v7

      - name: Fetch git tags
        run: git fetch --tags --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # When an image is unchanged on a main push, do not spend minutes rebuilding it.
      # Instead, tag the existing ECR image from the baseline commit with the new commit
      # tags so the deploy wrapper always finds both images at the exact same commit SHA.
      - name: Retag unchanged image in ECR
        id: retag
        if: env.PUSH == 'true' && needs.changes.outputs.moomoo-api-mcp != 'true'
        run: |
          deploy_tag="${GITHUB_SHA::7}"
          audit_tag="commit-${GITHUB_SHA}"
          repo="${{ env.IMAGE }}"
          region="${{ vars.AWS_REGION }}"
          baseline="${{ needs.changes.outputs.baseline }}"

          # If changes job had no verified baseline commit, must rebuild from source.
          if [ -z "${baseline}" ]; then
            echo "No baseline commit available to retag from. Building from source."
            echo "rebuild_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          baseline_sha="${baseline}"
          baseline_short="${baseline:0:7}"
          echo "Querying ECR for baseline commit image (${repo}:${baseline_short} or ${repo}:${baseline_sha})..."

          target_manifest=""
          target_digest=""
          for candidate_tag in "${baseline_short}" "${baseline_sha}" "commit-${baseline_sha}"; do
            d=$(aws ecr batch-get-image \
              --region "${region}" \
              --repository-name "${repo}" \
              --image-ids "imageTag=${candidate_tag}" \
              --query 'images[0].imageId.imageDigest' \
              --output text 2>/dev/null || true)

            if [ -n "${d}" ] && [ "${d}" != "None" ]; then
              m=$(aws ecr batch-get-image \
                --region "${region}" \
                --repository-name "${repo}" \
                --image-ids "imageTag=${candidate_tag}" \
                --query 'images[0].imageManifest' \
                --output text 2>/dev/null || true)

              if [ -n "${m}" ] && [ "${m}" != "None" ]; then
                target_digest="${d}"
                target_manifest="${m}"
                echo "Found baseline image in ECR under tag '${candidate_tag}' with digest '${target_digest}'."
                break
              fi
            fi
          done

          if [ -z "${target_manifest}" ] || [ "${target_manifest}" = "None" ]; then
            echo "No baseline image found in ECR for ${repo} at commit ${baseline}. Building from source."
            echo "rebuild_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Retagging baseline image with new commit tags: ${deploy_tag}, ${audit_tag}"
          tags_to_apply=("${deploy_tag}" "${audit_tag}")

          while IFS= read -r tag; do
            if [ "${tag}" != "${tag#v}" ]; then
              tags_to_apply+=("${tag}")
            fi
          done < <(git tag --points-at HEAD)

          for t in "${tags_to_apply[@]}"; do
            echo "Applying tag '${t}' to ${repo}..."
            if ! err_msg=$(aws ecr put-image \
              --region "${region}" \
              --repository-name "${repo}" \
              --image-tag "${t}" \
              --image-manifest "${target_manifest}" 2>&1); then

              # If put-image failed, verify if the tag already points to the exact same digest
              existing_digest=$(aws ecr batch-get-image \
                --region "${region}" \
                --repository-name "${repo}" \
                --image-ids "imageTag=${t}" \
                --query 'images[0].imageId.imageDigest' \
                --output text 2>/dev/null || true)

              if [ -n "${existing_digest}" ] && [ "${existing_digest}" = "${target_digest}" ]; then
                echo "Tag '${t}' already exists pointing to matching digest ${target_digest} (idempotent)."
              else
                echo "Error: Failed to apply tag '${t}' to ${repo}: ${err_msg}" >&2
                exit 1
              fi
            fi
          done

          echo "rebuild_needed=false" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: tags
        if: needs.changes.outputs.moomoo-api-mcp == 'true' || steps.retag.outputs.rebuild_needed == 'true'
        run: |
          deploy_tag="${GITHUB_SHA::7}"
          audit_tag="commit-${GITHUB_SHA}"

          if [ "${PUSH}" = "true" ]; then
            image="${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}"
            release_tags=""
            while IFS= read -r tag; do
              if [ "${tag}" != "${tag#v}" ]; then
                release_tags="${release_tags:+${release_tags},}${image}:${tag}"
              fi
            done < <(git tag --points-at HEAD)

            tags="${image}:${GITHUB_SHA},${image}:latest,${image}:${deploy_tag},${image}:${audit_tag}"
            if [ -n "${release_tags}" ]; then
              tags="${tags},${release_tags}"
            fi
            echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE }}:test" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: needs.changes.outputs.moomoo-api-mcp == 'true' || steps.retag.outputs.rebuild_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
