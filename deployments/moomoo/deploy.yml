---
- name: Migrate and deploy Moomoo without rerunning host provisioning
  hosts: vps
  gather_facts: false
  become: false
  vars:
    moomoo_mcp_source_dir: "{{ playbook_dir }}/../.."
  pre_tasks:
    - name: Require an explicit target limit before deployment
      ansible.builtin.assert:
        that:
          - ansible_limit | default('') | length > 0
          - ansible_play_hosts_all | length == 1
        fail_msg: Select exactly one application host with --limit.
  roles:
    - moomoo_mcp
