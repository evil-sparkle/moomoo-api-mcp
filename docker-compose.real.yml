# Durable REAL execution must keep its own directory and persistent volume.
# Preserve this volume and the paper volume through upgrades and mode changes.
services:
  moomoo-mcp:
    volumes:
      - real-execution-data:/app/real-execution-data
    environment:
      - MOOMOO_REAL_JOURNAL_PATH=/app/real-execution-data/execution.db
      - MOOMOO_CREATE_REAL_JOURNAL=${MOOMOO_CREATE_REAL_JOURNAL:-0}
      - MOOMOO_JOURNAL_LOCK_WAIT_MS=${MOOMOO_JOURNAL_LOCK_WAIT_MS:-5000}

volumes:
  real-execution-data:
