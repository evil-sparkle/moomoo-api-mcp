[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moomoo_mcp"]

[project]
name = "moomoo-api-mcp"
version = "0.2.0"
description = "Moomoo API MCP Server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Yichen Lu", email = "yichen.lu529@gamil.com" }
]
keywords = ["mcp", "moomoo", "trading", "finance", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Topic :: Office/Business :: Financial :: Investment",
]
urls.Repository = "https://github.com/Litash/moomoo-api-mcp"
urls.Issues = "https://github.com/Litash/moomoo-api-mcp/issues"
dependencies = [
    "anyio>=4.0.0",
    # <2 because the server is built on FastMCP: mcp 2.x renamed it to
    # MCPServer and moved the request context, so 2.x fails at import.
    # >=1.10.0 for structured tool output, which account and market-data
    # tools rely on to return typed results alongside text.
    "mcp>=1.10.0,<2",
    "moomoo-api>=10.10.7008",  # place_combo_order / ComboLeg
    "pandas>=2.0.0",
]

[project.scripts]
moomoo-api-mcp = "moomoo_mcp.server:main"

[project.optional-dependencies]
dev = [
    "basedpyright>=1.40.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["moomoo_mcp"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
# "standard" rather than basedpyright's default "recommended": the moomoo SDK
# is loosely typed (ret/data tuples typed as str | DataFrame), so stricter
# modes bury real findings under thousands of warnings. Pre-existing errors
# are recorded in .basedpyright/baseline.json; only new ones fail the check.
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
