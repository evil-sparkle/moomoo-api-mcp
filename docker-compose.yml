# One container, two supervised processes.
#
# OpenD's API has no authentication of its own: anything that can reach port
# 11111 can trade once the gateway is unlocked. Running the gateway and the MCP
# server in the same container lets the gateway listen on container loopback and
# nowhere else, so the boundary protecting it is the process boundary rather
# than "no other container happens to be attached to this bridge".
#
# The two are not interchangeable in how they fail, and the supervisor
# (moomoo_mcp/supervisor.py) is what keeps that distinction: a dead gateway is
# restarted in place, because the MCP endpoint must keep answering and the SDK
# reconnects underneath it; a dead server, or a gateway that will not come back,
# exits the container for `restart: unless-stopped` below to replace whole.
services:
  moomoo-mcp:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moomoo-api-mcp
    restart: unless-stopped
    # Belt and braces only. docker-init reaps orphans; it does not implement the
    # paired policy above, and a container whose supervisor merely backgrounded
    # OpenD would look healthy with no gateway behind it.
    init: true
    # The one-time interactive device login reads its SMS code from this tty:
    #   docker compose run --rm -it -e OPEND_INTERACTIVE=1 moomoo-mcp
    stdin_open: true
    tty: true
    volumes:
      # The only genuinely persistent state in the stack. Path and owning uid
      # are the ones OpenD already wrote as, so an existing volume is read
      # rather than re-authorized over SMS.
      - ${OPEND_DATA_DIR:-opend-data}:/home/opend/.com.moomoo.OpenD
    environment:
      # Loopback inside this container. Nothing else can reach it, and the
      # supervisor pins the gateway's own listener to the same address.
      - MOOMOO_OPEND_HOST=127.0.0.1
      - MOOMOO_OPEND_PORT=11111
      # --- gateway login ---
      - MOOMOO_LOGIN_ACCOUNT=${MOOMOO_LOGIN_ACCOUNT:-}
      - MOOMOO_LOGIN_PWD_MD5=${MOOMOO_LOGIN_PWD_MD5:-}
      - MOOMOO_LOGIN_BY_REMEMBER=${MOOMOO_LOGIN_BY_REMEMBER:-1}
      - MOOMOO_LOGIN_REGION=${MOOMOO_LOGIN_REGION:-sg}
      - OPEND_INTERACTIVE=${OPEND_INTERACTIVE:-0}
      # --- supervision policy (empty means the supervisor's own defaults) ---
      - OPEND_MAX_RESTARTS=${OPEND_MAX_RESTARTS:-}
      - OPEND_RESTART_WINDOW_SECONDS=${OPEND_RESTART_WINDOW_SECONDS:-}
      - SUPERVISOR_STOP_TIMEOUT_SECONDS=${SUPERVISOR_STOP_TIMEOUT_SECONDS:-}
      # --- MCP server ---
      - MOOMOO_SECURITY_FIRM=${MOOMOO_SECURITY_FIRM:-FUTUSG}
      - MOOMOO_TRADING_MODE=${MOOMOO_TRADING_MODE:-READ_ONLY}
      - MOOMOO_TRADE_PASSWORD=${MOOMOO_TRADE_PASSWORD:-}
      - MOOMOO_TRADE_PASSWORD_MD5=${MOOMOO_TRADE_PASSWORD_MD5:-}
      - MOOMOO_MAX_ORDER_QTY=${MOOMOO_MAX_ORDER_QTY:-}
      - MOOMOO_MAX_ORDER_NOTIONAL=${MOOMOO_MAX_ORDER_NOTIONAL:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
    ports:
      # Bind the MCP HTTP endpoint strictly to localhost on the host machine.
      # Port 11111 is published nowhere and has no line here on purpose.
      - "127.0.0.1:8000:8000"

volumes:
  opend-data:
