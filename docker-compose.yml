services:
  opend:
    build:
      context: .
      dockerfile: Dockerfile.opend
    platform: linux/amd64
    container_name: moomoo-opend
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      # Persistent volume preserving device authorization and session tokens for non-root opend user
      - ${OPEND_DATA_DIR:-opend-data}:/home/opend/.com.moomoo.OpenD
    working_dir: /opt/moomooOpenD
    environment:
      - LD_LIBRARY_PATH=/opt/moomooOpenD
      - MOOMOO_LOGIN_ACCOUNT=${MOOMOO_LOGIN_ACCOUNT:-}
      - MOOMOO_LOGIN_PWD_MD5=${MOOMOO_LOGIN_PWD_MD5:-}
      - MOOMOO_LOGIN_BY_REMEMBER=${MOOMOO_LOGIN_BY_REMEMBER:-1}
      - MOOMOO_LOGIN_REGION=${MOOMOO_LOGIN_REGION:-sg}
      - OPEND_INTERACTIVE=${OPEND_INTERACTIVE:-0}
      # OpenD must answer on the container's trading-net interface, not just
      # loopback: moomoo-mcp now has a network namespace of its own. Port 11111
      # is never published, so this listener is reachable only from containers
      # attached to trading-net — the OpenD API has no authentication of its
      # own, so keep it that way.
      - OPEND_API_IP=${OPEND_API_IP:-0.0.0.0}
    entrypoint:
      - /bin/sh
      - -c
      - |
        DATA_DIR="$${HOME:-/home/opend}/.com.moomoo.OpenD"
        has_token=0
        if [ -d "$$DATA_DIR/F3CNN/UserAccMap" ] || [ -n "$$(ls -A $$DATA_DIR/F3CNN/ftnet/auth_acc_list 2>/dev/null)" ] || [ -d "/root/.com.moomoo.OpenD/F3CNN/UserAccMap" ]; then
          has_token=1
        fi

        COMMON_ARGS="-api_ip=$${OPEND_API_IP:-0.0.0.0} -no_monitor=1 -lang=en -login_region=$$MOOMOO_LOGIN_REGION"

        if [ "$$OPEND_INTERACTIVE" = "1" ]; then
          if [ -n "$$MOOMOO_LOGIN_ACCOUNT" ]; then
            exec ./OpenD $$COMMON_ARGS -login_account=$$MOOMOO_LOGIN_ACCOUNT
          else
            exec ./OpenD $$COMMON_ARGS
          fi
        elif [ -n "$$MOOMOO_LOGIN_PWD_MD5" ]; then
          exec ./OpenD $$COMMON_ARGS -login_account=$$MOOMOO_LOGIN_ACCOUNT -login_pwd_md5=$$MOOMOO_LOGIN_PWD_MD5
        elif [ "$$MOOMOO_LOGIN_BY_REMEMBER" = "1" ] && [ -n "$$MOOMOO_LOGIN_ACCOUNT" ] && [ "$$has_token" = "1" ]; then
          exec ./OpenD $$COMMON_ARGS -login_account=$$MOOMOO_LOGIN_ACCOUNT -login_by_remember=1
        elif [ -n "$$MOOMOO_LOGIN_ACCOUNT" ]; then
          echo "ERROR: No usable headless login for $$MOOMOO_LOGIN_ACCOUNT: need MOOMOO_LOGIN_BY_REMEMBER=1 with a remembered token from the one-time interactive login. To perform one-time login: scripts/compose-prod.sh run --rm -it -e OPEND_INTERACTIVE=1 opend (or docker compose run --rm -it -e OPEND_INTERACTIVE=1 opend locally)" >&2
          exit 1
        else
          # Without an account OpenD prompts on stdin forever, which under `up -d`
          # looks "Up" while never logging in. Fail loudly instead of hanging.
          echo "ERROR: MOOMOO_LOGIN_ACCOUNT is empty. Set it in .env; headless start also needs a remembered token from the interactive login (OPEND_INTERACTIVE=1)." >&2
          exit 1
        fi
    networks:
      - trading-net
    # Port 11111 is NOT published to the host; it is reachable only from
    # containers attached to trading-net.

  moomoo-mcp:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moomoo-api-mcp
    restart: unless-stopped
    environment:
      - MOOMOO_OPEND_HOST=opend
      - MOOMOO_OPEND_PORT=11111
      - MOOMOO_SECURITY_FIRM=${MOOMOO_SECURITY_FIRM:-FUTUSG}
      - MOOMOO_TRADING_MODE=${MOOMOO_TRADING_MODE:-READ_ONLY}
      - MOOMOO_TRADE_PASSWORD=${MOOMOO_TRADE_PASSWORD:-}
      - MOOMOO_TRADE_PASSWORD_MD5=${MOOMOO_TRADE_PASSWORD_MD5:-}
      - MOOMOO_MAX_ORDER_QTY=${MOOMOO_MAX_ORDER_QTY:-}
      - MOOMOO_MAX_ORDER_NOTIONAL=${MOOMOO_MAX_ORDER_NOTIONAL:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
    ports:
      # Bind MCP HTTP endpoint strictly to localhost on host machine.
      # Published by the container that actually serves it, so restarting
      # OpenD cannot take the endpoint away from clients.
      - "127.0.0.1:8000:8000"
    networks:
      - trading-net
    depends_on:
      # Ordering only. Deliberately no `restart: true`: it would restart this
      # container whenever Compose restarts opend, ending every client session
      # to buy nothing. The SDK re-resolves the service name on each reconnect
      # attempt, so it follows a recreated gateway to a new address by itself,
      # and scripts/smoke-test.sh asserts that it does.
      opend:
        condition: service_started

networks:
  # Not `internal: true`: OpenD needs outbound internet to reach Moomoo's
  # servers. Isolation comes from publishing no port for 11111.
  trading-net:
    driver: bridge

volumes:
  opend-data:
