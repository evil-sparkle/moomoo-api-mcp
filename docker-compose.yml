services:
  opend:
    build:
      context: .
      dockerfile: Dockerfile.opend
      args:
        OPEND_VERSION: ${OPEND_VERSION:-10.10.7008}
        OPEND_TAG: ${OPEND_TAG:-v10.10.7008-opend}
        OPEND_URL: ${OPEND_URL:-https://github.com/evil-sparkle/moomoo-api-mcp/releases/download/v10.10.7008-opend/moomoo_OpenD_10.10.7008_Ubuntu18.04.tar.gz}
        OPEND_SHA256: ${OPEND_SHA256:-d38aad772b296f922e3b270119ca1abbadadc61cd3a45826e1b087a5b79069a5}
    platform: linux/amd64
    container_name: moomoo-opend
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      # Persistent volume preserving device authorization and session tokens for non-root opend user
      - ${OPEND_DATA_DIR:-opend-data}:/home/opend/.com.moomoo.OpenD
    working_dir: /opt/moomooOpenD
    environment:
      - LD_LIBRARY_PATH=/opt/moomooOpenD
      - MOOMOO_LOGIN_ACCOUNT=${MOOMOO_LOGIN_ACCOUNT:-}
      - MOOMOO_LOGIN_PWD_MD5=${MOOMOO_LOGIN_PWD_MD5:-}
      - MOOMOO_LOGIN_BY_REMEMBER=${MOOMOO_LOGIN_BY_REMEMBER:-1}
      - MOOMOO_LOGIN_REGION=${MOOMOO_LOGIN_REGION:-sg}
    entrypoint:
      - /bin/sh
      - -c
      - |
        DATA_DIR="$${HOME:-/home/opend}/.com.moomoo.OpenD"
        has_token=0
        if [ -d "$$DATA_DIR/F3CNN/UserAccMap" ] || [ -n "$$(ls -A $$DATA_DIR/F3CNN/ftnet/auth_acc_list 2>/dev/null)" ] || [ -d "/root/.com.moomoo.OpenD/F3CNN/UserAccMap" ]; then
          has_token=1
        fi

        COMMON_ARGS="-api_ip=127.0.0.1 -no_monitor=1 -lang=en -login_region=$$MOOMOO_LOGIN_REGION"

        if [ -n "$$MOOMOO_LOGIN_PWD_MD5" ]; then
          exec ./OpenD $$COMMON_ARGS -login_account=$$MOOMOO_LOGIN_ACCOUNT -login_pwd_md5=$$MOOMOO_LOGIN_PWD_MD5
        elif [ "$$MOOMOO_LOGIN_BY_REMEMBER" = "1" ] && [ -n "$$MOOMOO_LOGIN_ACCOUNT" ] && [ "$$has_token" = "1" ]; then
          exec ./OpenD $$COMMON_ARGS -login_account=$$MOOMOO_LOGIN_ACCOUNT -login_by_remember=1
        elif [ -n "$$MOOMOO_LOGIN_ACCOUNT" ]; then
          exec ./OpenD $$COMMON_ARGS -login_account=$$MOOMOO_LOGIN_ACCOUNT
        else
          # Without an account OpenD prompts on stdin forever, which under `up -d`
          # looks "Up" while never logging in. Fail loudly instead of hanging.
          echo "ERROR: MOOMOO_LOGIN_ACCOUNT is empty. Set it in .env; headless start also needs a remembered token from the interactive login." >&2
          exit 1
        fi
    ports:
      # Bind MCP SSE endpoint strictly to localhost on host machine
      # (Published via opend because moomoo-mcp shares its network namespace)
      - "127.0.0.1:8000:8000"
    # Port 11111 is NOT mapped to the host; only accessible to moomoo-mcp via localhost.

  moomoo-mcp:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moomoo-api-mcp
    restart: unless-stopped
    network_mode: "service:opend"
    environment:
      - MOOMOO_OPEND_HOST=127.0.0.1
      - MOOMOO_OPEND_PORT=11111
      - MOOMOO_SECURITY_FIRM=${MOOMOO_SECURITY_FIRM:-FUTUSG}
      - MOOMOO_TRADING_MODE=${MOOMOO_TRADING_MODE:-READ_ONLY}
      - MOOMOO_TRADE_PASSWORD_MD5=${MOOMOO_TRADE_PASSWORD_MD5:-}
      - MOOMOO_MAX_ORDER_QTY=${MOOMOO_MAX_ORDER_QTY:-}
      - MOOMOO_MAX_ORDER_NOTIONAL=${MOOMOO_MAX_ORDER_NOTIONAL:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
    depends_on:
      - opend

volumes:
  opend-data:
